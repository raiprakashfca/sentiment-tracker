<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23222'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='%23fff' font-family='sans-serif'>C</text></svg>">
<style>
  :root { --bg: #f4f4f4; --panel: #ffffff; --line: #dcdcdc; --text: #1c1c1c; --muted: #777; --me: #1c1c1c; --me-text: #fff; --them: #e8e8e8; --accent: #1c1c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --panel: #1b1b1b; --line: #2c2c2c; --text: #ececec; --muted: #8e8e8e; --me: #ececec; --me-text: #111; --them: #262626; --accent: #ececec; }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--panel); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  header .name { font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header a { color: var(--muted); font-size: 13px; text-decoration: none; padding: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: min(72%, 560px); padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: pretty; }
  .them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .msg time { display: block; font-size: 11px; opacity: .6; margin-top: 3px; text-align: right; font-variant-numeric: tabular-nums; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin: 8px 0; }
  .notice { align-self: center; color: var(--muted); font-size: 13px; margin-top: 40px; text-align: center; }
  form { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; min-height: 44px; max-height: 140px; outline: 2px solid transparent; transition-property: border-color; transition-duration: 150ms; }
  textarea:focus { border-color: var(--accent); }
  button { font: inherit; font-weight: 600; min-width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: var(--accent); color: var(--panel); cursor: pointer; transition-property: transform, opacity; transition-duration: 150ms; }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .5; }
  #toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 13px; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="avatar">C</div>
  <div><div class="name">Claude</div><div class="sub" id="sub">Connecting…</div></div>
  <span class="spacer"></span>
  <a href="/">Settings</a>
</header>
<div id="log"><div class="notice">Loading…</div></div>
<form id="composer">
  <textarea name="text" rows="1" maxlength="1000" placeholder="Message Claude" autofocus></textarea>
  <button type="submit" title="Send">➤</button>
</form>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const logEl = $('#log');
const form = $('#composer');
let lastKey = '';

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Sweetbot': '1' }, body: JSON.stringify(body),
  });
  if (res.status === 401) { location.replace('/login'); return new Promise(() => {}); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const timeOf = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayOf = (t) => new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });

function render(data) {
  $('#sub').textContent = data.connected ? 'online' : 'offline';
  const key = data.messages.map((m) => m.id + m.ack).join('|');
  if (key === lastKey) return;
  lastKey = key;
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  logEl.replaceChildren();
  if (!data.messages.length) {
    logEl.append(el('div', { className: 'notice', textContent: data.connected ? 'No messages yet.' : 'Not connected. Check Settings.' }));
    return;
  }
  let day = '';
  for (const m of data.messages) {
    const d = dayOf(m.t);
    if (d !== day) { day = d; logEl.append(el('div', { className: 'day', textContent: d })); }
    logEl.append(el('div', { className: `msg ${m.fromMe ? 'me' : 'them'}` }, m.text, el('time', { textContent: timeOf(m.t) })));
  }
  if (atBottom || !lastKey) logEl.scrollTop = logEl.scrollHeight;
}

async function refresh() {
  try { render(await api('/api/chat')); } catch (e) { $('#sub').textContent = e.message; }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const text = form.text.value.trim();
  if (!text) return;
  form.querySelector('button').disabled = true;
  try { await api('/api/send', { text }); form.text.value = ''; toast('Sending…'); setTimeout(refresh, 4000); }
  catch (e) { toast(e.message); }
  form.querySelector('button').disabled = false;
  form.text.focus();
});
form.text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
