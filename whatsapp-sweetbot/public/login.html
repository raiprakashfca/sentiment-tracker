<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweetbot — Log in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<style>
  :root {
    --bg: #faf7f5; --card: #ffffff; --text: #2b2227; --muted: #7a6d73; --line: #eee4e7;
    --accent: #d94f7a; --accent-soft: #fbe6ed; --err: #c53b3b; --err-soft: #fbe3e3;
    --shadow: 0 1px 2px rgba(43, 34, 39, .04), 0 8px 24px rgba(43, 34, 39, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17131a; --card: #211b24; --text: #f3eaf0; --muted: #a998a3; --line: #342a37;
      --accent: #f07aa0; --accent-soft: #3b2130; --err: #f07a7a; --err-soft: #3d1f22;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(100%, 380px); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  .muted { color: var(--muted); }
  form { display: grid; gap: 16px; margin-top: 22px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-height: 44px; transition-property: border-color, outline-color; transition-duration: 150ms; transition-timing-function: ease-out; outline: 2px solid transparent; }
  input:focus { outline-color: var(--accent-soft); border-color: var(--accent); }
  button { font: inherit; font-weight: 600; min-height: 44px; border: 1px solid var(--accent); border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; transition-property: transform, filter, opacity; transition-duration: 150ms; transition-timing-function: ease-out; }
  button:hover { filter: brightness(1.05); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: default; transform: none; }
  #error { color: var(--err); background: var(--err-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { input, button { transition-duration: 0ms; } button:active { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>💌 Sweetbot</h1>
  <p class="muted">This control panel is locked. Enter the password to open it.</p>
  <form id="login">
    <label>Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <p id="error" role="alert" hidden></p>
    <button type="submit">Log in</button>
  </form>
</main>

<script>
const form = document.querySelector('#login');
const error = document.querySelector('#error');
const button = form.querySelector('button');

function showError(text) {
  error.textContent = text;
  error.hidden = false;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  error.hidden = true;
  button.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Sweetbot': '1' },
      body: JSON.stringify({ password: form.password.value }),
    });
    if (res.ok) return location.replace('/');
    const data = await res.json().catch(() => ({}));
    showError(data.error || `Error ${res.status}`);
  } catch {
    showError('The bot is not running. Double-click "Start Sweetbot" to turn it on.');
  }
  button.disabled = false;
  form.password.select();
});
</script>
</body>
</html>
